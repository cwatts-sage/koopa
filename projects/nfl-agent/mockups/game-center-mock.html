<style>
:root{--bg:#0b1020;--panel:#141c33;--line:#25314f;--txt:#e8edf7;--mut:#8fa0c0;

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);
font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:16px}
h1{font-size:19px;margin:0 0 2px}
.sub{color:var(--mut);font-size:13px;margin-bottom:14px}
.badge{display:inline-block;background:#243154;color:#a9bde6;border-radius:999px;
padding:2px 9px;font-size:11px;margin-left:6px;vertical-align:middle}

/* ---- Field ---- */
.fieldwrap{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0 10px}
.field{position:relative;width:100%;aspect-ratio:2.4/1;border-radius:10px;overflow:hidden;
background:repeating-linear-gradient(90deg,var(--turf) 0 5%,var(--turf2) 5% 10%);
border:1px solid #2b3d5c}
.ez{position:absolute;top:0;bottom:0;width:8.33%;display:flex;align-items:center;
justify-content:center;font-weight:700;font-size:11px;letter-spacing:.14em;color:#fff;opacity:.95}
.ez.l{left:0;background:var(--away)}
.ez.r{right:0;background:var(--home)}
.ez span{transform:rotate(-90deg);white-space:nowrap}
.yl{position:absolute;top:0;bottom:0;width:1px;background:rgba(255,255,255,.22)}
.yl.major{background:rgba(255,255,255,.42)}
.ynum{position:absolute;top:6px;transform:translateX(-50%);font-size:9px;color:rgba(255,255,255,.75)}
.ynum.b{top:auto;bottom:6px}
/* line of scrimmage + first down */
.los{position:absolute;top:0;bottom:0;width:2px;background:#2f7bff;box-shadow:0 0 8px #2f7bff}
.fd{position:absolute;top:0;bottom:0;width:2px;background:#ffd23f;box-shadow:0 0 8px #ffd23f}
/* movement arc */
.move{position:absolute;height:3px;top:50%;transform:translateY(-50%);border-radius:2px;opacity:.95}
.move.gain{background:linear-gradient(90deg,rgba(63,224,130,.15),#3fe082)}
.move.loss{background:linear-gradient(90deg,#ff6b6b,rgba(255,107,107,.15))}
.ball{position:absolute;top:50%;width:15px;height:10px;border-radius:50%;
background:#a0521d;border:1.5px solid #f2e3cf;transform:translate(-50%,-50%);
box-shadow:0 2px 6px rgba(0,0,0,.5);transition:left .35s ease}
.flag{position:absolute;top:50%;transform:translate(-50%,-50%);font-size:15px}

.readout{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px;font-size:13px}
.pill{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 9px}
.pill b{color:#fff}

/* ---- Log ---- */
.drive{border:1px solid var(--line);border-radius:10px;margin:10px 0;overflow:hidden;background:var(--panel)}
.dh{display:flex;align-items:center;gap:9px;padding:10px 12px;cursor:pointer;user-select:none}
.dh:hover{background:#18223d}
.chip{font-weight:700;font-size:11px;padding:2px 7px;border-radius:5px;color:#fff}
.dres{margin-left:auto;font-size:12px;color:var(--mut)}
.dres.score{color:#3fe082;font-weight:700}
.caret{color:var(--mut);font-size:11px;width:10px}
.plays{display:none;border-top:1px solid var(--line)}
.plays.open{display:block}
.play{display:flex;gap:10px;padding:9px 12px;border-bottom:1px solid rgba(255,255,255,.05);
cursor:pointer;font-size:13.5px}
.play:last-child{border-bottom:0}
.play:hover{background:#18223d}
.play.sel{background:#1d2b4d;box-shadow:inset 3px 0 0 #2f7bff}
.dd{color:var(--mut);font-size:11.5px;min-width:96px;flex-shrink:0}
.ptxt{flex:1}
.tags{margin-top:3px;display:flex;gap:5px;flex-wrap:wrap}
.tag{font-size:10px;padding:1px 6px;border-radius:4px;font-weight:700}
.t-score{background:#14532d;color:#4ade80}
.t-to{background:#7f1d1d;color:#fca5a5}
.t-pen{background:#78350f;color:#fbbf24}
.gain{font-size:11px;color:var(--mut);white-space:nowrap}
.note{margin:16px 0 8px;padding:10px 12px;border-left:3px solid #2f7bff;
background:#121a30;color:var(--mut);font-size:12.5px;border-radius:0 8px 8px 0}
kbd{background:#243154;border-radius:4px;padding:1px 5px;font-size:11px}

const HOME_ID = Object.keys(G.teams).find(k=>G.teams[k].home);
const AWAY_ID = Object.keys(G.teams).find(k=>!G.teams[k].home);

// Field geometry: endzones occupy 8.33% each; playing field is the middle 83.33%.
const EZ=8.3333, PLAY=100-EZ*2;
// ESPN yardLine is absolute 0-100 from the AWAY endzone.
function pct(yardLine){ return EZ + (yardLine/100)*PLAY; }

// yard markers
const f=document.getElementById('field');
for(let y=10;y<=90;y+=10){
  const d=document.createElement('div');
  d.className='yl'+(y%50===0?' major':''); d.style.left=pct(y)+'%'; f.appendChild(d);
  const lab=(y<=50? y : 100-y);
  const n=document.createElement('div'); n.className='ynum'; n.style.left=pct(y)+'%';
  n.textContent=lab; f.appendChild(n);
  const n2=n.cloneNode(true); n2.className='ynum b'; f.appendChild(n2);
}
for(let y=5;y<100;y+=5){ if(y%10===0)continue;
  const d=document.createElement('div'); d.className='yl'; d.style.left=pct(y)+'%';
  d.style.opacity=.35; f.appendChild(d); }

const flat=[];
G.drives.forEach((d,di)=>d.plays.forEach((p,pi)=>flat.push({...p,di,pi,driveTeam:d.teamId})));

function render(){
  const log=document.getElementById('log');
  log.innerHTML=G.drives.map((d,di)=>{
    const t=G.teams[d.teamId]||{abbr:d.abbr,color:'#444'};
    const scoreCls=d.isScore?' score':'';
    const plays=d.plays.map((p,pi)=>{
      const tags=[];
      if(p.score)tags.push('<span class="tag t-score">TD/SCORE</span>');
      if(p.to)tags.push('<span class="tag t-to">TURNOVER</span>');
      if(p.pen)tags.push('<span class="tag t-pen">PENALTY</span>');
      const g=(p.gain===null||p.gain===undefined)?'':(p.gain>0?'+'+p.gain:p.gain)+' yd';
      return `<div class="play" data-di="${di}" data-pi="${pi}">
        <div class="dd">${p.ddText||p.type||''}</div>
        <div class="ptxt">${p.text}${tags.length?'<div class="tags">'+tags.join('')+'</div>':''}</div>
        <div class="gain">${g}</div></div>`;
    }).join('');
    return `<div class="drive">
      <div class="dh" data-toggle="${di}">
        <span class="caret" id="c${di}">▶</span>
        <span class="chip" style="background:${t.color}">${t.abbr||''}</span>
        <span>${d.desc||''}</span>
        <span class="dres${scoreCls}">${d.result||''}</span>
      </div>
      <div class="plays" id="p${di}">${plays}</div></div>`;
  }).join('');

  log.querySelectorAll('[data-toggle]').forEach(el=>el.onclick=()=>{
    const i=el.dataset.toggle, box=document.getElementById('p'+i);
    box.classList.toggle('open');
    document.getElementById('c'+i).textContent=box.classList.contains('open')?'▼':'▶';
  });
  log.querySelectorAll('.play').forEach(el=>el.onclick=()=>{
    select(+el.dataset.di,+el.dataset.pi);
  });
}

let cur=null;
function select(di,pi){
  const d=G.drives[di], p=d.plays[pi];
  const box=document.getElementById('p'+di);
  if(!box.classList.contains('open')){box.classList.add('open');
    document.getElementById('c'+di).textContent='▼';}
  document.querySelectorAll('.play.sel').forEach(e=>e.classList.remove('sel'));
  const el=document.querySelector(`.play[data-di="${di}"][data-pi="${pi}"]`);
  if(el){el.classList.add('sel');el.scrollIntoView({block:'nearest',behavior:'smooth'});}
  cur={di,pi};

  const s=p.startYL, e=p.endYL;
  const ball=document.getElementById('ball');
  const los=document.getElementById('los');
  const fd=document.getElementById('fd');
  const mv=document.getElementById('move');
  const flag=document.getElementById('flag');

  if(s!=null){los.style.display='block';los.style.left=pct(s)+'%';}else los.style.display='none';
  if(e!=null){ball.style.left=pct(e)+'%';}

  // first down marker from start down/distance
  if(s!=null&&p.dist!=null&&p.down){
    // possession team determines direction: home drives toward away EZ (left)
    const dir = (p.posTeam===HOME_ID)? -1 : 1;
    const target=s+dir*p.dist;
    if(target>0&&target<100){fd.style.display='block';fd.style.left=pct(target)+'%';}
    else fd.style.display='none';
  } else fd.style.display='none';

  if(s!=null&&e!=null&&s!==e){
    const a=Math.min(pct(s),pct(e)), b=Math.max(pct(s),pct(e));
    mv.style.display='block';mv.style.left=a+'%';mv.style.width=(b-a)+'%';
    mv.className='move '+((p.gain||0)<0?'loss':'gain');
  } else mv.style.display='none';

  flag.style.display = p.score||p.to ? 'block':'none';
  if(p.score){flag.textContent='🏈';flag.style.left=pct(e??s)+'%';}
  else if(p.to){flag.textContent='🔄';flag.style.left=pct(e??s)+'%';}

  document.getElementById('r-dd').innerHTML='<b>'+(p.ddText||p.type||'—')+'</b>';
  document.getElementById('r-clock').textContent='Q'+(p.period||'?')+' · '+(p.clock||'—');
  const g=(p.gain==null)?'—':(p.gain>0?'+'+p.gain:p.gain)+' yd';
  document.getElementById('r-gain').textContent=g;
  document.getElementById('r-score').innerHTML=
    G.teams[AWAY_ID].abbr+' <b>'+(p.away??0)+'</b> · '+G.teams[HOME_ID].abbr+' <b>'+(p.home??0)+'</b>';
}
document.addEventListener('keydown',ev=>{
  if(!cur)return;
  const i=flat.findIndex(x=>x.di===cur.di&&x.pi===cur.pi);
  if(ev.key==='ArrowDown'&&i<flat.length-1){ev.preventDefault();select(flat[i+1].di,flat[i+1].pi);}
  if(ev.key==='ArrowUp'&&i>0){ev.preventDefault();select(flat[i-1].di,flat[i-1].pi);}
});
render();
document.getElementById('p0').classList.add('open');
document.getElementById('c0').textContent='▼';
select(0,0);
</script></body></html>
